<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <title>Greenmify — marketplace do campo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-view="explore" aria-label="Greenmify início">
        <span class="brand-mark">g</span>
        <span>greenmify<span class="brand-dot">.</span><small>o campo mais perto</small></span>
      </a>

      <div class="side-label">MENU PRINCIPAL</div>
      <nav class="main-nav" aria-label="Navegação principal">
        <button class="nav-link active" data-view="explore"><span class="nav-icon">⌕</span> Explorar <span class="nav-chevron">›</span></button>
        <button class="nav-link" data-view="favorites"><span class="nav-icon">♡</span> Favoritos <span class="nav-count" id="favorite-count">0</span></button>
        <button class="nav-link" data-view="messages"><span class="nav-icon">▤</span> Mensagens <span class="nav-count unread-count" id="message-count">0</span></button>
        <button class="nav-link role-only" data-view="listings"><span class="nav-icon">▦</span> Meus anúncios</button>
        <button class="nav-link admin-only" data-view="moderation"><span class="nav-icon">◈</span> Moderação <span class="nav-count" id="moderation-count">0</span></button>
      </nav>

      <div class="side-label side-label-spaced">SUA CONTA</div>
      <button class="nav-link" data-view="profile"><span class="nav-icon">◉</span> Meu perfil</button>
      <button class="nav-link" id="create-account"><span class="nav-icon">＋</span> Criar conta</button>

      <div class="sidebar-bottom">
        <div class="help-card">
          <div class="help-icon">✳</div>
          <strong>Feito para quem<br>faz o campo crescer.</strong>
          <span>Uma ponte entre quem produz e quem procura.</span>
        </div>
        <div class="side-user">
          <div class="avatar" id="sidebar-avatar">M</div>
          <div class="side-user-copy"><strong id="sidebar-name">Marina Costa</strong><span id="sidebar-role">Consumidora</span></div>
          <button class="more-button" data-view="profile" aria-label="Abrir perfil">···</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumbs"><span>Greenmify</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Explorar</strong></div>
        <div class="topbar-actions">
          <span class="local-status"><span class="status-dot"></span><span id="connection-label">Protótipo local</span></span>
          <label class="role-switch-label" for="role-switch">Visualizar como</label>
          <select id="role-switch" aria-label="Trocar perfil de demonstração">
            <option value="consumer">Consumidor</option>
            <option value="producer">Produtor</option>
            <option value="admin">Administrador</option>
          </select>
          <button class="top-avatar" data-view="profile" id="top-avatar" aria-label="Abrir perfil">M</button>
        </div>
      </header>
      <div id="app-content" class="page-content"></div>
      <footer class="footer-note">GREENMIFY <span>·</span> Protótipo navegável para validação da proposta <span>·</span> Dados fictícios</footer>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-region" aria-live="polite"></div>
</body>
</html>
